name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare
        run: |
          mkdir -p www assets
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png Kalameh-Medium.woff www/
          cp icon-only.png assets/
      - run: npm install
      - run: npx cap add android
      - name: Icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2F6BFF' --iconBackgroundColorDark '#0b1230' || true
      - name: Permissions
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: planner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
