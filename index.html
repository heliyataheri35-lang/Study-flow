async function daily(){try{const l=LN();if(!l)return;await l.requestPermissions();await l.cancel({notifications:[{id:2300},{id:2400}]});await l.schedule({notifications:[{id:2300,title:'گزارش روزانه آماده است',body:'ببین امروز چه کردی و کارهای مانده رو جابه‌جا کن',schedule:{on:{hour:S.rh,minute:0},allowWhileIdle:true}},{id:2400,title:'مرور هفته',body:'امروز جمعه‌ست؛ مرور هفته‌ات رو ثبت کن',schedule:{on:{weekday:6,hour:20,minute:0},allowWhileIdle:true}}]})}catch(e){}}
catchup();render();daily();setInterval(tick,1000);setTimeout(()=>{$('#sp').classList.add('hide');setTimeout(()=>{$('#sp').remove();chk();if(S.run)openPm()},800)},2600);
if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
