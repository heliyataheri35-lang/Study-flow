<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),fd=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);

async function daily(){try{const l=LN();if(!l)return;await l.requestPermissions();await l.cancel({notifications:[{id:2300}]});await l.schedule({notifications:[{id:2300,title:'گزارش روزانه آماده است',body:'ببین امروز چه کردی و کارهای مانده رو جابه‌جا کن',schedule:{on:{hour:23,minute:0},allowWhileIdle:true}}]})}catch(e){}}
render();daily();setInterval(tick,1000);setTimeout(()=>{$('#sp').classList.add('hide');setTimeout(()=>{$('#sp').remove();chk();if(S.run)openPm()},800)},2600);
if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
